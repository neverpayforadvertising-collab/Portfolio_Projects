version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: shopflow_postgres
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
      POSTGRES_DB: shopflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: shopflow_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:

product-service:
    build: ./services/product-service
    container_name: shopflow_product_service
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      # - redis