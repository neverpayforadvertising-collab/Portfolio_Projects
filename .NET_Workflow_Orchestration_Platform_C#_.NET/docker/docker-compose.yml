version: '3.9'
services:
  platform-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - AzureAd__Authority=https://login.microsoftonline.com/{tenant}
      - AzureAd__Audience=api://default
    depends_on: []
