version: '3.9'
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: catalog_mssql
    environment:
      SA_PASSWORD: "YourStrong!Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"YourStrong!Passw0rd\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mssqldata:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: catalog_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: catalog_backend
    environment:
      - PORT=4000
      - DB_HOST=mssql
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASSWORD=YourStrong!Passw0rd
      - DB_DATABASE=CatalogOps
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_KEY=supersecret-api-key
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "4000:4000"
    # CHANGED: healthcheck added — works now that /api/v1/health is public (no API key).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # CHANGED: moved from runtime `environment` to build args — Vite env
        # vars are baked into the bundle at BUILD time, so runtime env did nothing.
        VITE_API_BASE_URL: http://localhost:4000/api/v1
        VITE_API_KEY: supersecret-api-key
    container_name: catalog_frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  mssqldata:
